<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Production Engineering Stories</title>
  <desc id="desc">A portfolio banner for production incident response, delivery, quality assurance and customer enablement stories.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1d31"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7dd3fc" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="2"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="58" y="66" fill="#7dd3fc" font-size="14" font-weight="700" letter-spacing="2">ATHANASIOS ZAPRIOS</text>
    <text x="58" y="126" fill="#f8fafc" font-size="54" font-weight="800">Production Engineering Stories</text>
    <text x="58" y="170" fill="#cbd5e1" font-size="23">Real incidents, delivery decisions and operational outcomes.</text>
    <rect x="58" y="194" width="610" height="5" rx="3" fill="url(#accent)"/>

    <g font-size="14" font-weight="700">
      <rect x="58" y="226" width="165" height="38" rx="19" fill="#0f2a43" stroke="#38bdf8" stroke-opacity="0.35"/>
      <text x="85" y="251" fill="#bae6fd">INCIDENT RESPONSE</text>
      <rect x="237" y="226" width="150" height="38" rx="19" fill="#0f2a43" stroke="#2dd4bf" stroke-opacity="0.35"/>
      <text x="270" y="251" fill="#99f6e4">WEB DELIVERY</text>
      <rect x="401" y="226" width="138" height="38" rx="19" fill="#0f2a43" stroke="#818cf8" stroke-opacity="0.35"/>
      <text x="438" y="251" fill="#c7d2fe">QA &amp; RELEASE</text>
      <rect x="553" y="226" width="180" height="38" rx="19" fill="#0f2a43" stroke="#a78bfa" stroke-opacity="0.35"/>
      <text x="585" y="251" fill="#ddd6fe">CLIENT ENABLEMENT</text>
    </g>

    <g transform="translate(810 54)">
      <rect width="330" height="232" rx="22" fill="#07111f" stroke="#334155"/>
      <text x="28" y="38" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1.4">STORY STRUCTURE</text>
      <g font-size="17" font-weight="700" fill="#e2e8f0">
        <text x="28" y="84">Situation</text>
        <text x="28" y="124">Task</text>
        <text x="28" y="164">Action</text>
        <text x="28" y="204">Result</text>
      </g>
      <path d="M205 80 L235 120 L265 160 L295 200" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="205" cy="80" r="7" fill="#38bdf8"/>
      <circle cx="235" cy="120" r="7" fill="#2dd4bf"/>
      <circle cx="265" cy="160" r="7" fill="#818cf8"/>
      <circle cx="295" cy="200" r="7" fill="#a78bfa"/>
    </g>

    <g transform="translate(58 316)">
      <g><rect width="250" height="72" rx="16" fill="#0b1728" stroke="#1e3a5f"/><text x="20" y="34" fill="#f8fafc" font-size="28" font-weight="800">21</text><text x="20" y="57" fill="#94a3b8" font-size="13" font-weight="700">DOCUMENTED STORIES</text></g>
      <g transform="translate(268 0)"><rect width="250" height="72" rx="16" fill="#0b1728" stroke="#1e3a5f"/><text x="20" y="34" fill="#f8fafc" font-size="28" font-weight="800">60+</text><text x="20" y="57" fill="#94a3b8" font-size="13" font-weight="700">LIVE SITES &amp; APPS</text></g>
      <g transform="translate(536 0)"><rect width="250" height="72" rx="16" fill="#0b1728" stroke="#1e3a5f"/><text x="20" y="34" fill="#f8fafc" font-size="28" font-weight="800">30</text><text x="20" y="57" fill="#94a3b8" font-size="13" font-weight="700">CLIENT ENGAGEMENTS</text></g>
      <g transform="translate(804 0)"><rect width="280" height="72" rx="16" fill="#0b1728" stroke="#1e3a5f"/><text x="20" y="34" fill="#f8fafc" font-size="28" font-weight="800">3+ YEARS</text><text x="20" y="57" fill="#94a3b8" font-size="13" font-weight="700">CLIENT-FACING DELIVERY</text></g>
    </g>
